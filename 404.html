<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        (function() {
            // 1. Get the path and force it to lowercase
            var path = window.location.pathname.toLowerCase();
            
            // 2. Kill any current loading to stop the "loop/tweak"
            window.stop();

            // 3. The "Leyah" Catch-All
            // This catches /leyah, /LEYAH, /LeyAh, /leyah.html, etc.
            if (path.includes('leyah')) {
                window.location.replace("/leyah.html");
                return;
            } 

            // 4. The "Shabnam" Catch-All
            else if (path.includes('shabnam')) {
                window.location.replace("/shabnam.html");
                return;
            }

            // 5. If it's something else with caps, try to lowercase it
            else if (/[A-Z]/.test(window.location.pathname)) {
                window.location.replace(path + ".html");
                return;
            }

            // 6. Otherwise, go home
            else {
                window.location.replace("/");
            }
        })();
    </script>
</head>
<body style="background-color: #0d181f; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh;">
    <p>Loading your exclusive preview...</p>
</body>
</html>
