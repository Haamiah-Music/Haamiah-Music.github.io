<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        (function() {
            var path = window.location.pathname.toLowerCase();

            // This catches /LEYAH, /Leyah, or /leyah and sends them to the file
            if (path.includes('leyah')) {
                window.location.replace("/leyah.html");
            } 
            // If they type something else in CAPS, it lowercases it
            else if (/[A-Z]/.test(window.location.pathname)) {
                window.location.replace(window.location.pathname.toLowerCase());
            }
            // Otherwise, back to the main site
            else {
                window.location.replace("/");
            }
        })();
    </script>
</head>
<body>
    <p>Redirecting to Leyah's preview...</p>
</body>
</html>
