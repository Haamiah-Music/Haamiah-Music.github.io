<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Traffic Controller: Redirects case-insensitive URLs to specific project pages
    var path = window.location.pathname.toUpperCase();

    if (path.includes('/SHABNAM')) {
      window.location.href = 'https://haamiah.com/shabnamjaleh.html';
    } 
    else if (path.includes('/JAVID')) {
      window.location.href = 'https://haamiah.com/javid.html';
    }
    else if (path.includes('/YVONNE')) {
      window.location.href = 'https://haamiah.com/yvonne.html';
    }
    else {
      // Default fallback to homepage for any other broken links
      window.location.href = 'https://haamiah.com/';
    }
  </script>
</head>
<body>
</body>
</html>
