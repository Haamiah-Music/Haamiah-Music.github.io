<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        (function() {
            var currentUrl = window.location.href;
            var path = window.location.pathname.toLowerCase();

            // 1. Check if the user was trying to reach 'leyah'
            if (path.includes('leyah')) {
                // Force the correct lowercase extension
                var target = "/leyah.html";
                window.location.replace(target);
            } 
            // 2. Otherwise, if it's just a casing error for other pages, fix it
            else if (/[A-Z]/.test(window.location.pathname)) {
                window.location.replace(window.location.pathname.toLowerCase());
            }
            // 3. If it's a legitimate dead link, go home
            else {
                window.location.replace("/");
            }
        })();
    </script>
</head>
<body>
    <p>Redirecting to the correct page...</p>
</body>
</html>
