<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        (function() {
            var path = window.location.pathname.toLowerCase();

            // 1. Check for Shabnam (any casing)
            if (path.includes('shabnam')) {
                window.location.replace("/shabnam.html");
            } 
            // 2. Check for Leyah (any casing)
            else if (path.includes('leyah')) {
                window.location.replace("/leyah.html");
            }
            // 3. Fix general casing for main pages (Home, Music, etc.)
            else if (/[A-Z]/.test(window.location.pathname)) {
                window.location.replace(window.location.pathname.toLowerCase());
            }
            // 4. Default fallback: if the link is truly broken, go home
            else {
                window.location.replace("/");
            }
        })();
    </script>
</head>
<body>
    <p>Redirecting to the correct page...</p>
</body>
</html>
