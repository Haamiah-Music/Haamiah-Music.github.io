<!DOCTYPE html>

<head>
  <title>Marketing Content</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Coda&display=swap');

    body {
      margin: 0;
      padding: 0;
      font-family: 'Coda', sans-serif;
      background-image: url("images/bg.png"); /* Replace with the actual path to your PNG image */
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center center;
      background-attachment: fixed; /* Fix the background position */
    }

    h1, h2, p {
      color: white;
      text-align: center;
      z-index: 1;
    }

    .taskbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: #00000080; /* Adjust the transparency and color as desired */
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
    }

    .taskbar ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 30px;
    }

    .taskbar ul li {
      margin: 0 10px;
    }

    .taskbar ul li a {
      color: white;
      text-decoration: none;
      font-size: 18px;
      padding: 5px 10px;
      transition: color 0.3s, background-color 0.3s, transform 0.3s;
    }

    .taskbar ul li a:hover {
      color: aqua;
      background-color: #000000; /* Adjust the background color on hover as desired */
      transform: scale(1.1);
    }

    .image-list {
      margin-top: 120px; /* Adjust the margin-top value to create space below the navigation bar and header */
      display: block;
      text-align: center;
      padding: 20px;
    }

    .image-list ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .image-list li {
      margin: 20px 0;
    }

    .image-list li a {
      display: inline-block;
      width: 400px; /* Adjust the image width as desired */
      height: 300px; /* Adjust the image height as desired */
      border: 2px solid white; /* Add border */
      border-radius: 5px;
      overflow: hidden;
    }

    .image-list li a img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }

    .image-list li a:hover img {
      transform: scale(1.1);
    }

    .image-description {
      font-size: 18px;
      color: white;
      margin-top: 10px;
      display: inline-block;
      text-align: center;
    }
    
    /* Center the navigation bar */
    .taskbar ul {
      margin: 0 auto;
    }

  </style>
