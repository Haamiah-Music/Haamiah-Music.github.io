<!DOCTYPE html>
<html>
<head>
  <title>HAAMIAH - Contact</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Coda&display=swap');
    body {
      margin: 0;
      padding: 0;
      font-family: 'Coda', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    h1, h2, p {
      color: white;
      text-align: center;
      z-index: 1;
    }
    
    .taskbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: #00000080;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
    }
    
    .taskbar ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 30px;
    }
    
    .taskbar ul li {
      margin: 0 10px;
    }
    
    .taskbar ul li a {
      color: white;
      text-decoration: none;
      font-size: 18px;
      padding: 5px 10px;
      transition: color 0.3s, background-color 0.3s, transform 0.3s;
    }
    
    .taskbar ul li a:hover {
      color: aqua;
      background-color: #000000;
      transform: scale(1.1);
    }
    
    .taskbar ul li a.active {
      color: orange;
      background-color: #000000;
    }
    
    .video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      z-index: -1;
    }
    
    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 1;
      filter: brightness(100%);
    }
    
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 100px;
      padding-bottom: 40px;
      width: 100%;
      max-width: 800px;
      box-sizing: border-box;
    }
    
    .contact-card {
      background: rgba(13, 24, 31, 0.85);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      margin-bottom: 30px;
      text-align: center;
      animation: fadeIn 1s ease-out;
    }
    
    .profile-img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid aqua;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
      margin-bottom: 20px;
      animation: fadeIn 1.2s ease-out;
    }
    
    .contact-info {
      margin: 20px 0;
      animation: fadeIn 1.4s ease-out;
    }
    
    .contact-info h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      color: aqua;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    }
    
    .contact-info h2 {
      font-size: 1.2rem;
      margin: 15px 0;
      font-weight: normal;
      color: white;
    }
    
    .contact-info a {
      color: aqua;
      text-decoration: none;
      transition: all 0.3s ease;
    }
    
    .contact-info a:hover {
      color: white;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.7);
    }
    
    .social-links {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 30px;
      animation: fadeIn 1.6s ease-out;
    }
    
    .social-links a {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: white;
      text-decoration: none;
      transition: transform 0.3s ease;
    }
    
    .social-links a:hover {
      transform: translateY(-5px);
    }
    
    .social-links img {
      width: 80px;
      height: 80px;
      border-radius: 15px;
      object-fit: contain;
      background: rgba(255, 255, 255, 0.1);
      padding: 10px;
      transition: all 0.3s ease;
    }
    
    .social-links a:hover img {
      background: rgba(0, 255, 255, 0.2);
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
    }
    
    .social-links span {
      margin-top: 10px;
      font-size: 1rem;
      color: white;
    }
    
    .logo {
      display: flex;
      align-items: center;
    }
    
    .logo img {
      width: 40px;
      height: 40px;
      margin-left: -70px;
    }
    
    /* Center the navigation bar */
    .taskbar ul {
      margin: 0 auto;
    }
    
    /* Fade-in animation */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    /* Responsive design */
    @media (max-width: 768px) {
      .taskbar {
        flex-direction: column;
        position: sticky;
        top: 0;
      }
      
      .logo {
        order: 2;
        margin-top: 10px;
      }
      
      .taskbar ul {
        order: 1;
      }
      
      .content {
        padding-top: 120px;
      }
      
      .contact-card {
        padding: 30px 20px;
        width: 90%;
      }
      
      .profile-img {
        width: 120px;
        height: 120px;
      }
      
      .contact-info h1 {
        font-size: 2rem;
      }
      
      .contact-info h2 {
        font-size: 1rem;
      }
      
      .social-links {
        flex-wrap: wrap;
        gap: 20px;
      }
      
      .social-links img {
        width: 60px;
        height: 60px;
      }
    }
    
    @media (max-width: 480px) {
      .content {
        padding-top: 140px;
      }
      
      .contact-card {
        padding: 25px 15px;
      }
      
      .profile-img {
        width: 100px;
        height: 100px;
      }
      
      .contact-info h1 {
        font-size: 1.8rem;
      }
      
      .social-links {
        gap: 15px;
      }
      
      .social-links img {
        width: 50px;
        height: 50px;
      }
    }
  </style>

</head>

    <div class="logo">
      <img src="images/Haamiah (LOGO2).png" alt="Logo">
    </div>
  </div>

    <video src="images/bgvideo.mp4" autoplay loop muted>

  <div class="content">

      <img src="images/profile_pic.png" alt="Your Photo" class="profile-img">
      
      <div class="contact-info">
        <h1>Ali Kazeminy</h1>
        <h2>Phone: <a href="tel:+19095477497">+1 909-547-7497</a></h2>

        <a href="mailto:info@HAAMIAH.com" target="_blank">
          <img src="images/Gmail_Logo.png" alt="Email">
          <span>Email</span> 
        </a>
      </div>
    </div>
  </div>
