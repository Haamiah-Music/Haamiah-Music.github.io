<!DOCTYPE html>
<html>
<head>
  <title>HAAMIAH - Contact</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Coda&display=swap');

    body {
      margin: 0;
      padding: 0;
      font-family: 'Coda', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1, h2, p {
      color: white;
      text-align: center;
      z-index: 1;
    }
    
    .taskbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: #00000080;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
    }
    
    .taskbar ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 30px;
    }
    
    .taskbar ul li {
      margin: 0 10px;
    }
    
    .taskbar ul li a {
      color: white;
      text-decoration: none;
      font-size: 18px;
      padding: 5px 10px;
      transition: color 0.3s, background-color 0.3s, transform 0.3s;
    }
    
    .taskbar ul li a:hover {
      color: aqua;
      background-color: #000000;
      transform: scale(1.1);
    }
    
    .taskbar ul li a.active {
      color: orange;
      background-color: #000000;
    }

    .video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      z-index: -1;
    }
    
    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 1;
      filter: brightness(100%);
    }
    
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 100px;
    }
    
    .social-links {
      text-align: center;
      margin-top: 20px;
    }
    
    .social-links a {
      display: inline-block;
      margin: 10px;
      opacity: 1;
      color: white;
      text-decoration: none;
      position: relative;
    }
    
    .social-links img {
      display: block;
      width: 100px;
      height: 70px;
      transition: transform 0.3s;
    }
    
    .social-links a:hover img {
      transform: scale(1.2);
    }
    
    .social-links span {
      position: absolute;
      bottom: -20px;
      left: 0;
      right: 0;
      font-size: 14px;
      text-align: center;
    }
    
    .logo {
      display: flex;
      align-items: center;
    }
    
    .logo img {
      width: 40px;
      height: 40px;
      margin-left: -70px;
    }
    
    /* Center the navigation bar */
    .taskbar ul {
      margin: 0 auto;
    }

    /* === NEW: Simple dark background behind text only === */
    .text-bg {
      background-color: rgba(0, 0, 0, 0.5);
      padding: 8px 16px;
      border-radius: 6px;
      display: inline-block;
      margin: 10px 0;
    }

  </style>

</head>
<body>
  <div class="taskbar">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="music.html">Music</a></li>
      <li><a href="motion_graphics.html">Motion Graphics</a></li>
      <li><a href="3d_visuals.html">3D Visuals</a></li>
      <li><a href="marketing_content.html">Marketing Content</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
    <div class="logo">
      <img src="images/Haamiah (LOGO2).png" alt="Logo">
    </div>
  </div>

  <div class="video-container">
    <video src="images/bgvideo.mp4" autoplay loop muted>
      <!-- Replace "path/to/video.mp4" with the actual path to your video file -->
    </video>
  </div>

  <div class="content">
    <div class="text-bg">
      <h1>Ali Kazeminy</h1>
    </div>
    <img src="images/profile_pic.png" alt="Your Photo">
    <div class="text-bg">
      <h2>Phone: +1 909-547-7497</h2>
    </div>
    <div class="text-bg">
      <a href="mailto:info@HAAMIAH.com" style="color: white; text-decoration: none;">
        <h2>Email</h2>
      </a>
    </div>
    <div class="social-links">
      <a href="mailto:info@HAAMIAH.com" target="_blank">
        <img src="images/Gmail_Logo.png" alt="Email">
        <span>Email</span> 
      </a>
    </div>
  </div>

</body>
