<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAAMIAH - Collaboration (Javid)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Coda&display=swap');

    body {
      margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center;
      font-family: 'Coda', sans-serif; min-height: 100vh;
      background-color: #000;
      background-image: url('images/HAAMIAH-WP.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      color: white;
    }

    .top-action-bar { 
      width: 100%; padding: 40px 0; display: flex; flex-direction: column; align-items: center; gap: 20px; z-index: 10;
    }
    
    .btn-visit-site {
      color: white; text-decoration: none; font-size: 14px; padding: 12px 30px;
      border-radius: 25px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;
      background: linear-gradient(135deg, #FF8C00, #FF4500);
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
    }

    .btn-lyrics {
      color: white; border: none; font-size: 20px; padding: 18px 50px;
      border-radius: 35px; font-weight: bold; cursor: pointer;
      text-transform: uppercase; letter-spacing: 2px;
      background: linear-gradient(135deg, #00ced1, #008b8b);
      box-shadow: 0 6px 20px rgba(0,0,0,0.8);
    }

    .main-container { width: 100%; flex: 1; display: flex; justify-content: center; align-items: center; padding-bottom: 60px; z-index: 1; }

    .player-card {
      background-color: rgba(0, 0, 0, 0.85); 
      border: 1px solid rgba(0, 255, 255, 0.3);
      border-radius: 20px; padding: 40px; max-width: 450px; width: 85%; text-align: center;
      box-shadow: 0 30px 60px rgba(0,0,0,0.9);
      backdrop-filter: blur(10px);
    }

    .metadata-container { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }

    .cover-art {
      width: 120px; height: 120px; object-fit: cover; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .titles { display: flex; flex-direction: column; align-items: flex-start; text-align: left; }
    h1 { color: #FFA500; font-size: 1.6rem; margin: 0; }
    h2 { color: aqua; font-size: 1rem; margin: 5px 0 0; }

    .controls { display: flex; flex-direction: column; gap: 25px; }
    .progress-container { display: flex; align-items: center; gap: 12px; font-size: 0.8rem; }
    input[type="range"] { flex-grow: 1; cursor: pointer; accent-color: aqua; }

    .buttons-row { display: flex; justify-content: center; align-items: center; gap: 25px; }
    .play-btn {
      background: linear-gradient(135deg, aqua, #004d4d); border: none; width: 65px; height: 65px; border-radius: 50%;
      cursor: pointer; display: flex; justify-content: center; align-items: center;
    }

    .repeat-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 8px 15px; border-radius: 15px; cursor: pointer; font-size: 0.7rem; }
    .repeat-btn.active { background: #FF8C00; }

    .lyrics-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; }
    .lyrics-box { background: #000; border: 2px solid aqua; border-radius: 20px; padding: 40px; max-width: 500px; width: 85%; max-height: 75vh; overflow-y: auto; text-align: center; position: relative; white-space: pre-wrap; color: #fff; }
    .close-btn { position: absolute; top: 15px; right: 20px; color: #FF4500; font-size: 28px; font-weight: bold; cursor: pointer; }

    @media (max-width: 600px) {
      .player-card { padding: 30px 15px; }
      .cover-art { width: 100px; height: 100px; }
    }
  </style>
</head>
<body>

  <div class="top-action-bar">
    <a href="index.html" class="btn-visit-site">To visit my website click here</a>
    <button class="btn-lyrics" onclick="showLyrics()">Lyrics</button>
  </div>

  <div class="main-container">
    <div class="player-card">
      <div class="metadata-container">
        <img src="images/javid.png" alt="Cover Art" class="cover-art">
        <div class="titles">
          <h1>Shekasteh Del</h1>
          <h2>Exclusive Demo Preview</h2>
        </div>
      </div>

      <audio id="audio-player" src="music/demo/Shekasteh Del (Demo).mp3"></audio>
      
      <div class="controls">
        <div class="progress-container">
          <span id="current-time">0:00</span>
          <input type="range" id="seek-slider" value="0" max="100">
          <span id="duration">0:00</span>
        </div>
        <div class="buttons-row">
          <button class="repeat-btn" id="repeat-toggle">REPEAT: OFF</button>
          <button class="play-btn" id="play-pause">
            <svg id="play-icon" width="28" height="28" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pause-icon" width="28" height="28" viewBox="0 0 24 24" fill="white" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
        </div>
        <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px;">
            <small style="color: #888; font-size: 0.7rem;">VOLUME</small>
            <input type="range" id="volume-slider" value="80" max="100" style="width: 80px;">
        </div>
      </div>
    </div>
  </div>

  <div id="lyricsOverlay" class="lyrics-overlay" onclick="hideLyrics()">
    <div class="lyrics-box" onclick="event.stopPropagation()">
      <span class="close-btn" onclick="hideLyrics()">&times;</span>
      <h3 style="color:aqua; margin-top: 0;">LYRICS</h3>
      <div id="lyrics-display">Loading...</div>
    </div>
  </div>

  <script>
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-pause');
    const playIcon = document.getElementById('play-icon');
    const pauseIcon = document.getElementById('pause-icon');
    const seekSlider = document.getElementById('seek-slider');
    const currentTimeText = document.getElementById('current-time');
    const durationText = document.getElementById('duration');
    const repeatBtn = document.getElementById('repeat-toggle');
    const volumeSlider = document.getElementById('volume-slider');

    playBtn.addEventListener('click', () => {
      if (audio.paused) { audio.play(); playIcon.style.display = 'none'; pauseIcon.style.display = 'block'; }
      else { audio.pause(); playIcon.style.display = 'block'; pauseIcon.style.display = 'none'; }
    });

    audio.addEventListener('timeupdate', () => {
      if (!isNaN(audio.duration)) {
        const pos = (audio.currentTime / audio.duration) * 100;
        seekSlider.value = pos || 0;
        let mins = Math.floor(audio.currentTime / 60);
        let secs = Math.floor(audio.currentTime % 60);
        currentTimeText.textContent = `${mins}:${secs < 10 ? '0' + secs : secs}`;
      }
    });

    seekSlider.addEventListener('input', () => { audio.currentTime = audio.duration * (seekSlider.value / 100); });
    audio.addEventListener('loadedmetadata', () => {
      let mins = Math.floor(audio.duration / 60);
      let secs = Math.floor(audio.duration % 60);
      durationText.textContent = `${mins}:${secs < 10 ? '0' + secs : secs}`;
    });

    repeatBtn.addEventListener('click', () => { audio.loop = !audio.loop; repeatBtn.textContent = audio.loop ? 'REPEAT: ON' : 'REPEAT: OFF'; repeatBtn.classList.toggle('active'); });
    volumeSlider.addEventListener('input', () => { audio.volume = volumeSlider.value / 100; });

    function showLyrics() {
      document.getElementById('lyricsOverlay').style.display = 'flex';
      // Ensure you have javid-lyrics.txt in the music/demo/ folder
      fetch('music/demo/javid-lyrics.txt')
        .then(res => res.text()).then(text => { document.getElementById('lyrics-display').textContent = text; })
        .catch(() => { document.getElementById('lyrics-display').textContent = "Lyrics currently unavailable."; });
    }
    function hideLyrics() { document.getElementById('lyricsOverlay').style.display = 'none'; }
  </script>
</body>
</html>
