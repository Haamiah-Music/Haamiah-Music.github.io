<!DOCTYPE html>
<html>
<head>
  <title>HAAMIAH - Music</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Coda&display=swap');

    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Coda', sans-serif;
    }

    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 1;
      z-index: -1;
    }

    h1, h2, p {
      color: white;
      text-align: center;
      z-index: 1;
    }
    
    .taskbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: #00000080;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
    }
    
    .taskbar ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 30px;
    }
    
    .taskbar ul li {
      margin: 0 10px;
    }
    
    .taskbar ul li a {
      color: white;
      text-decoration: none;
      font-size: 18px;
      padding: 5px 10px;
      transition: color 0.3s, background-color 0.3s, transform 0.3s;
    }
    
    .taskbar ul li a:hover {
      color: aqua;
      background-color: #000000;
      transform: scale(1.1);
    }
    
    .taskbar ul li a.active {
      color: orange;
      background-color: #000000;
    }
       
    .music-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 150px;
      margin-bottom: 20px;
      color: white;
      background-color: rgba(0, 0, 0, 0.6);
      padding: 20px;
      overflow-y: auto;
      max-height: calc(100vh - 200px);
      border: 1px solid white;
      border-radius: 10px;
    }
    
    /* === Updated Music Player Styles === */
    .music-player {
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #ffffff30;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      width: 500px; /* Wider player */
      max-width: 90vw;
      color: white;
    }

    .music-player h3 {
      margin: 0 0 15px 0;
      font-size: 22px;
      letter-spacing: 1px;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-top: 10px;
    }

    .controls button {
      border: none;
      background-color: transparent;
      color: white;
      font-size: 28px; /* Larger buttons */
      cursor: pointer;
      transition: all 0.3s ease;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .controls button:hover {
      color: aqua;
      transform: scale(1.2);
      background-color: rgba(255, 255, 255, 0.1);
    }

    .controls button.active {
      color: orange;
    }

    .progress-bar {
      width: 100%;
      height: 12px;
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      margin-top: 20px;
      overflow: hidden;
    }

    .progress-bar .progress {
      width: 0;
      height: 100%;
      background-color: #00ffff;
      border-radius: 6px;
      transition: width 0.1s linear;
    }

    /* === Music List (Unchanged) === */
    .music-list {
      margin-top: 20px;
      background-color: rgba(0, 0, 0, 0.6);
      padding: 10px;
      border-radius: 5px;
      border: 1px solid white;
      width: 500px;
      max-width: 90vw;
    }
    
    .music-list ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    
    .music-list li {
      margin: 10px 0;
    }
    
    .music-list li a {
      color: white;
      text-decoration: none;
      font-size: 16px;
      transition: color 0.3s, transform 0.3s;
    }
    
    .music-list li a:hover {
      color: aqua;
      text-decoration: underline;
      transform: scale(1.05);
    }
    
    .music-list li a.active {
      color: orange;
    }
    
    .logo {
      display: flex;
      align-items: center;
    }
    
    .logo img {
      width: 40px;
      height: 40px;
      margin-left: -70px;
    }
    
    /* Center the navigation bar */
    .taskbar ul {
      margin: 0 auto;
    }
    
    @media (max-width: 768px) {
      .taskbar {
        flex-direction: column;
        position: sticky;
        top: 0;
      }
    
      .logo {
        order: 2;
        margin-top: 10px;
      }
    
      .taskbar ul {
        order: 1;
      }
    }
  </style>

</head>
<body>
  <video id="bg-video" src="images/bgvideo.mp4" autoplay loop muted></video>

  <div class="taskbar">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="music.html" class="active">Music</a></li>
      <li><a href="motion_graphics.html">Motion Graphics</a></li>
      <li><a href="3d_visuals.html">3D Visuals</a></li>
      <li><a href="marketing_content.html">Marketing Content</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="logo">
      <img src="images/Haamiah (LOGO2).png" alt="Logo">
    </div>
  </div>

  <!-- === Music Player (Now Bigger & Better) === -->
  <div class="music-player">
    <h3>Now Playing</h3>
    <audio id="audio-player" src=""></audio>

    <div class="controls">
      <button id="play-button" title="Play">&#9658;</button>
      <button id="pause-button" title="Pause">&#10074;&#10074;</button>
      <button id="stop-button" title="Stop">&#9632;</button>
    </div>

    <div class="progress-bar">
      <div class="progress"></div>
    </div>
  </div>

  <!-- === Music List === -->
  <div class="music-list">
    <ul>
      <li><a href="#" class="song-link" data-src="music/HAAMIAH - Prolific.wav">Prolific</a></li>
      <li><a href="#" class="song-link" data-src="music/HAAMIAH - Prolific (Chill Mix).wav">Prolific (Chill Mix)</a></li>
      <li><a href="#" class="song-link" data-src="music/HAAMIAH - Zeereh Baroon.wav">Zeereh Baroon</a></li>
      <li><a href="#" class="song-link" data-src="music/HAAMIAH - Volcano.wav">Volcano</a></li>
      <li><a href="#" class="song-link" data-src="music/HAAMIAH - Levitate.wav">Levitate</a></li>
      <li><a href="#" class="song-link" data-src="music/HAAMIAH - Rise Of The Phoenix.wav">Rise Of The Phoenix</a></li>
      <li><a href="#" class="song-link" data-src="music/HAAMIAH - Inception.wav">Inception</a></li>
      <li><a href="#" class="song-link" data-src="music/HAAMIAH - Refraction.wav">Refraction</a></li>
    </ul>
  </div>

  <script>
    const audioPlayer = document.getElementById('audio-player');
    const playButton = document.getElementById('play-button');
    const pauseButton = document.getElementById('pause-button');
    const stopButton = document.getElementById('stop-button');
    const progressBar = document.querySelector('.progress-bar .progress');
    const songLinks = document.querySelectorAll('.song-link');

    // Set default song on load
    audioPlayer.src = "music/HAAMIAH - Prolific.wav";

    playButton.addEventListener('click', () => {
      audioPlayer.play();
      playButton.classList.add('active');
      pauseButton.classList.remove('active');
      stopButton.classList.remove('active');
    });

    pauseButton.addEventListener('click', () => {
      audioPlayer.pause();
      pauseButton.classList.add('active');
      playButton.classList.remove('active');
      stopButton.classList.remove('active');
    });

    stopButton.addEventListener('click', () => {
      audioPlayer.pause();
      audioPlayer.currentTime = 0;
      stopButton.classList.add('active');
      pauseButton.classList.remove('active');
      playButton.classList.remove('active');
    });

    audioPlayer.addEventListener('timeupdate', () => {
      const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
      progressBar.style.width = progress + '%';
    });

    songLinks.forEach((link) => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const songSrc = link.getAttribute('data-src');
        audioPlayer.src = songSrc;
        audioPlayer.play();
      });
    });
  </script>

</html>
