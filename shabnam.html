<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
        var path = window.location.pathname;
        var lowerPath = path.toLowerCase();
        
        // 1. Fix Case (SHABNAM -> shabnam)
        // 2. Fix Extension (.htm -> .html)
        // 3. Handle No Extension (shabnam -> shabnam.html)
        var correctedPath = lowerPath;
        if (correctedPath.endsWith('.htm')) {
            correctedPath += 'l';
        } else if (!correctedPath.endsWith('.html') && correctedPath.includes('shabnam')) {
            correctedPath = correctedPath.replace(/shabnam.*/, 'shabnam.html');
        }

        if (path !== correctedPath) {
            window.location.replace(correctedPath);
        }
    })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAAMIAH - Collaboration (Shabnam)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Coda&display=swap');

    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Coda', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      background-color: #0d181f;
      background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('images/HAAMIAH-WP.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: white;
    }

    .top-action-bar {
      width: 100%;
      padding: 30px 0;
      display: flex;
      justify-content: center;
      z-index: 10;
    }

    .btn-visit-site {
      color: white;
      text-decoration: none;
      font-size: 16px;
      padding: 10px 25px;
      border-radius: 25px;
      background: linear-gradient(135deg, #FF8C00, #FF4500);
      box-shadow: 0 4px 15px rgba(255, 140, 0, 0.3);
      transition: all 0.3s ease;
      font-weight: bold;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    }

    .btn-visit-site:hover {
      background: linear-gradient(135deg, #FFDAB9, #FFA07A);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 140, 0, 0.5);
    }

    .bg-logo-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60%;
      opacity: 0.1;
      z-index: -1;
      pointer-events: none;
    }

    .main-container {
      width: 100%;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-bottom: 60px;
      z-index: 1;
    }

    .player-card {
      background-color: rgba(13, 24, 31, 0.85);
      border: 2px solid #0d181f;
      border-radius: 15px;
      padding: 40px;
      max-width: 500px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      animation: fadeIn 1s ease-out;
      backdrop-filter: blur(10px);
    }

    h1 { color: #FFA500; font-size: 2rem; margin-bottom: 10px; }
    h2 { color: aqua; font-size: 1.2rem; margin-bottom: 30px; }

    .controls { display: flex; flex-direction: column; gap: 20px; }

    .progress-container {
      display: flex;
      align-items: center;
      gap: 15px;
      color: white;
    }

    input[type="range"] {
      flex-grow: 1;
      cursor: pointer;
      accent-color: aqua;
    }

    .buttons-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .play-btn {
      background: linear-gradient(135deg, aqua, #001f3f);
      border: none;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(0, 255, 255, 0.3);
    }

    .play-btn:hover { transform: scale(1.05); }

    .repeat-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid #444;
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .repeat-btn.active {
      background: #FF8C00;
      border-color: #FF8C00;
    }

    .nocturne-tag {
        position: fixed;
        bottom: 15px;
        right: 20px;
        font-size: 10px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: white;
        opacity: 0.2;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <img src="images/Haamiah (LOGO2).png" class="bg-logo-overlay" alt="">

  <div class="top-action-bar">
    <a href="index.html" class="btn-visit-site">Click here to visit my website</a>
  </div>

  <div class="main-container">
    <div class="player-card">
      <h1>For Shabnam</h1>
      <h2>Exclusive Demo Preview</h2>

      <audio id="audio-player" src="music/DEMO/Dolateh Eshgh (DEMO).mp3"></audio>

      <div class="controls">
        <div class="progress-container">
          <span id="current-time">0:00</span>
          <input type="range" id="seek-slider" value="0" max="100">
          <span id="duration">0:00</span>
        </div>

        <div class="buttons-row">
          <button class="repeat-btn" id="repeat-toggle">REPEAT: OFF</button>

          <button class="play-btn" id="play-pause">
            <svg id="play-icon" width="30" height="30" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pause-icon" width="30" height="30" viewBox="0 0 24 24" fill="white" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
        </div>

        <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
            <small style="color: #888;">VOLUME</small>
            <input type="range" id="volume-slider" value="80" max="100" style="width: 100px;">
        </div>
      </div>
    </div>
  </div>

  <div class="nocturne-tag">nocturne</div>

  <script>
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-pause');
    const playIcon = document.getElementById('play-icon');
    const pauseIcon = document.getElementById('pause-icon');
    const seekSlider = document.getElementById('seek-slider');
    const currentTimeText = document.getElementById('current-time');
    const durationText = document.getElementById('duration');
    const repeatBtn = document.getElementById('repeat-toggle');
    const volumeSlider = document.getElementById('volume-slider');

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
      } else {
        audio.pause();
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      }
    });

    audio.addEventListener('timeupdate', () => {
      const pos = (audio.currentTime / audio.duration) * 100;
      seekSlider.value = pos || 0;
      let mins = Math.floor(audio.currentTime / 60);
      let secs = Math.floor(audio.currentTime % 60);
      currentTimeText.textContent = `${mins}:${secs < 10 ? '0' + secs : secs}`;
    });

    seekSlider.addEventListener('input', () => {
      audio.currentTime = audio.duration * (seekSlider.value / 100);
    });

    audio.addEventListener('loadedmetadata', () => {
      let mins = Math.floor(audio.duration / 60);
      let secs = Math.floor(audio.duration % 60);
      durationText.textContent = `${mins}:${secs < 10 ? '0' + secs : secs}`;
    });

    repeatBtn.addEventListener('click', () => {
      audio.loop = !audio.loop;
      repeatBtn.textContent = audio.loop ? 'REPEAT: ON' : 'REPEAT: OFF';
      repeatBtn.classList.toggle('active');
    });

    volumeSlider.addEventListener('input', () => {
      audio.volume = volumeSlider.value / 100;
    });
  </script>
</body>
</html>
