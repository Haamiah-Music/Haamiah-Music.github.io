<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIFA 26 - England vs Mexico</title>
  <style>
    body {
      /* Background setup to use your EM.jpg image */
      background-image: url('images/EM.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    /* Overlay fallback to ensure legibility if the image takes a moment to load */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.4); /* Subtle dark tint over the image */
      z-index: -1;
    }

    .container {
      max-width: 850px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      /* Heavy black outline effect */
      text-shadow: 
        -2px -2px 0 #000,  
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000,
         0px  3px 8px rgba(0,0,0,0.8);
    }

    /* Responsive Wrapper for the Google Drive Video Player */
    .video-responsive {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.7);
      background-color: #000;
      margin-bottom: 15px;
    }

    .video-responsive iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .instruction-text {
      color: #ffffff;
      margin: 25px auto 25px auto;
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.5;
      max-width: 650px;
      /* Clear black outline effect for instructions */
      text-shadow: 
        -1.5px -1.5px 0 #000,  
         1.5px -1.5px 0 #000,
        -1.5px  1.5px 0 #000,
         1.5px  1.5px 0 #000,
         0px  2px 5px rgba(0,0,0,0.9);
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      background-color: #fff;
      color: #000;
      text-decoration: none;
      padding: 14px 40px;
      font-weight: 800;
      letter-spacing: 1px;
      border-radius: 30px;
      transition: transform 0.2s, background-color 0.2s;
      box-shadow: 0 5px 20px rgba(0,0,0,0.5);
    }

    .download-btn:hover {
      transform: scale(1.05);
      background-color: #e5e5e5;
    }

    .download-btn svg {
      margin-right: 8px;
      stroke-width: 3px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>FIFA 26: England vs Mexico</h1>

    <div class="video-responsive">
      <iframe src="https://drive.google.com/file/d/1RN0wyxAfLTysJTdh4559FNXI5jIeNXIg/preview" allow="autoplay" allowfullscreen></iframe>
    </div>

    <p class="instruction-text">
      Auntie Yvonne you may download the game by clicking on the download link or you can just stream it on my website
    </p>

    <div>
      <a href="https://drive.google.com/uc?export=download&id=1RN0wyxAfLTysJTdh4559FNXI5jIeNXIg" target="_blank" class="download-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        DOWNLOAD
      </a>
    </div>
  </div>

</body>
</html>
