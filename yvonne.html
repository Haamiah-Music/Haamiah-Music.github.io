<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIFA 26 - England vs Mexico</title>
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      max-width: 800px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 5px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .instruction-text {
      color: #aaa;
      margin: 20px auto 25px auto;
      font-size: 1.05rem;
      line-height: 1.5;
      max-width: 600px;
    }

    video {
      width: 100%;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      background-color: #000;
      margin-bottom: 15px;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      background-color: #00ffd5;
      color: #000;
      text-decoration: none;
      padding: 12px 35px;
      font-weight: 700;
      letter-spacing: 0.5px;
      border-radius: 30px;
      transition: transform 0.2s, background-color 0.2s;
      box-shadow: 0 4px 15px rgba(255,255,255,0.1);
    }

    .download-btn:hover {
      transform: scale(1.03);
      background-color: #ff6200;
    }

    .download-btn svg {
      margin-right: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>FIFA 26: England vs Mexico</h1>

    <video controls playsinline preload="metadata" x-webkit-airplay="allow">
      <source src="images/FIFA26_England_Mexico.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <p class="instruction-text">
      Auntie Yvonne you may download the game by clicking on the download link or you can just stream it on my website
    </p>

    <div>
      <a href="images/FIFA26_England_Mexico.mp4" download="FIFA26_England_Mexico.mp4" class="download-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        DOWNLOAD
      </a>
    </div>
  </div>

</body>
</html>
